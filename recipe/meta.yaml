{% set version = "2.0" %}

package:
  name: topojson
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/topojson/topojson-{{ version }}.tar.gz
  sha256: 48725ef37746902b83e2cf49683beece05b6e9eb4fb07978560aeedd8fac6544

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python >=3
    - pip
    - flit
  run:
    - python >=3
    - numpy
    - shapely
    - packaging

test:
  imports:
    - topojson

about:
  home: "https://github.com/mattijn/topojson"
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: "topojson - a powerful library to encode spatial data as topology in Python!"
  doc_url: https://mattijn.github.io/topojson
  dev_url: https://github.com/mattijn/topojson

extra:
  recipe-maintainers:
    - mattijn
